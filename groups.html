<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackyn | Groups</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        .tkn-page-shield {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            z-index: 100000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
        }
    </style>

    <script>
        // 1. Immediate local session check
        const currentUser = sessionStorage.getItem('trackynUser');
        
        // Target Deployed Apps Script Web App Endpoint
        const TRACKYN_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzRwVluxodwhiBrQ3uj9JDw6u9vF8nrFYqWGZs2buBsuLNAqu--LaNUfyQL0HBJI5pGew/exec';
        
        if (!currentUser) {
            window.location.replace('pet-owner.html');
        } else {
            // 2. Server-side verification loop targeting backend configuration rules
            document.addEventListener("DOMContentLoaded", () => {
                
                // Pure local environment testing fallback bypass:
                if (TRACKYN_BACKEND_URL.includes('AKfycbzRwVluxodwhiBrQ3uj9JDw6u9vF8nrFYqWGZs2buBsuLNAqu--LaNUfyQL0HBJI5pGew')) {
                    console.warn("Trackyn Development Notice: Running decoupled from backend. Access shield removed.");
                    const shield = document.getElementById('tknAuthShield');
                    if (shield) shield.remove();
                    // Populate with client simulation fallback values
                    fetchInitialData(true);
                    return;
                }

                // Construct verification payload
                const verificationUrl = `${TRACKYN_BACKEND_URL}?action=verify_group_access&Username=${encodeURIComponent(currentUser)}`;

                fetch(verificationUrl, {
                    method: 'POST',
                    mode: 'cors'
                })
                .then(response => response.json())
                .then(data => {
                    if (data && data.success) {
                        // Drop shield and fetch operational layout parameters
                        fetchInitialData(false);
                    } else {
                        handleAuthFailure();
                    }
                })
                .catch(error => {
                    console.error("Security authorization network handshake failed:", error);
                    handleAuthFailure();
                });
            });
        }

        function handleAuthFailure() {
            sessionStorage.clear();
            window.location.replace('pet-owner.html');
        }
    </script>
</head>
<body id="top" class="bg-primary">

    <div id="tknAuthShield" class="tkn-page-shield">
        <div class="tkn-modern-loader">
            <div class="tkn-spinner-container">
                <div class="tkn-spinner-ring" style="border-top-color: #141979;"></div>
                <div class="tkn-spinner-dot" style="background-color: #141979;"></div>
            </div>
            <h3 class="tkn-auth-text" style="color: #141979; font-weight: 600; margin-top: 20px; font-size: 1.1rem; letter-spacing: -0.02em;">
                Verifying Credentials...
            </h3>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="Trackyn Logo" class="logo-img">
            </a>
        </div>
        
        <ul class="nav-links">
            <li class="close-menu-container">
                <i class="fa-solid fa-xmark close-menu" aria-label="Close menu"></i>
            </li>
            <li><a href="index.html">Home</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="groups.html" style="text-decoration: underline;">Groups</a></li>
            <li><a href="partner.html">Partner Program</a></li>
            <li><a href="how-it-works.html">How It Works</a></li>
            <li><a href="shop.html">Shop</a></li>
        </ul>

        <div class="nav-actions">
            <div class="cart">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count">0</span>
            </div>
            <div class="menu-toggle" aria-label="Open menu">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <main class="groups-main-container">
        
        <header class="groups-page-header">
            <h1 class="groups-title">Groups Feed</h1>
            <p class="groups-subtitle">View groups and posts below.</p>
        </header>

        <div class="groups-layout">
            
            <section class="feed-column" id="feedColumnContainer">
                
                <div class="create-post-card">
                    <textarea id="tkn-post-textarea" placeholder="Share an update, request rescue tracking, or write an announcement..."></textarea>
                    <div class="create-post-card-actions">
                        <button class="btn-submit-post" id="btnSubmitPost" onclick="executePostPublish()">
                            Publish Post <i class="fa-solid fa-paper-plane" style="margin-left: 6px;"></i>
                        </button>
                    </div>
                </div>

                <div id="dynamicFeedZone"></div>
            </section>

            <aside class="sidebar-column">
                <div class="sidebar-content-box">
                    <div class="search-container">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="sidebar-search" placeholder="Search groups...">
                    </div>

                    <h3 class="sidebar-title">Suggested Groups</h3>
                    
                    <div class="suggested-groups-list" id="dynamicGroupsZone">
                        </div>
                </div>
            </aside>

        </div>
    </main>

    <footer class="footer bg-primary">
        <div class="footer-left">
            <p class="email-text">trackyn.id@gmail.com</p>
            <div class="footer-bottom-text">
                <p>Trackyn</p>
                <p class="copyright">&copy; 2026 Trackyn. All rights reserved.</p>
            </div>
        </div>
        <div class="footer-right">
            <div class="footer-logo-container">
                <img src="images/logo.png" alt="Trackyn Logo" class="footer-logo-img">
            </div>
            <div class="social-icons vibrant">
                <a href="#" class="social-fb"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="social-ig"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-yt"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" class="social-x"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="social-li"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" class="social-tt"><i class="fa-brands fa-tiktok"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // Global Navigation Toggle Handling
        const menuToggle = document.querySelector('.menu-toggle');
        const closeMenu = document.querySelector('.close-menu');
        const navLinks = document.querySelector('.nav-links');

        if(menuToggle) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.add('active');
                document.body.style.overflow = 'hidden'; 
            });
        }

        if(closeMenu) {
            closeMenu.addEventListener('click', () => {
                navLinks.classList.remove('active');
                document.body.style.overflow = 'auto'; 
            });
        }

        // ==========================================
        // DYNAMIC CONTENT PLATFORM PIPELINE HANDLERS
        // ==========================================

        async function executeBackendAction(action, payload) {
            const formData = new URLSearchParams();
            formData.append('action', action);
            for (const item in payload) {
                formData.append(item, payload[item]);
            }
            const response = await fetch(TRACKYN_BACKEND_URL, { method: 'POST', body: formData });
            return await response.json();
        }

        async function fetchInitialData(isFallbackDevMode) {
            if (isFallbackDevMode) {
                renderTimelineFeed(getFallbackPosts());
                renderGroupSuggestions([]);
                return;
            }

            try {
                const response = await fetch(`${TRACKYN_BACKEND_URL}?action=get_groups_data&Username=${encodeURIComponent(currentUser)}`);
                const stateData = await response.json();
                
                if (stateData.success) {
                    renderTimelineFeed(stateData.posts);
                    renderGroupSuggestions(stateData.joinedGroups);
                    
                    // Smoothly remove structural access protection loader
                    const shield = document.getElementById('tknAuthShield');
                    if (shield) shield.remove();
                }
            } catch (err) {
                console.error("Critical component synchronizer failure:", err);
                const loaderText = document.querySelector('.tkn-auth-text');
                if (loaderText) {
                    loaderText.style.color = '#ef4444';
                    loaderText.innerText = "Sync failure. Please refresh the workspace.";
                }
            }
        }

        function renderTimelineFeed(posts) {
            const container = document.getElementById('dynamicFeedZone');
            container.innerHTML = '';

            if (!posts || posts.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding:30px; color:#64748b; font-family:'Inter';">No updates available in your feed loop.</p>`;
                return;
            }

            posts.forEach(post => {
                container.appendChild(buildPostCardNode(post.PostID, post.Username, post.Content, post.Timestamp, post.Likes, post.GroupName || 'Trackyn Global Circle'));
            });
        }

        function buildPostCardNode(id, user, text, time, likes, groupContext) {
            const article = document.createElement('article');
            article.className = 'feed-card';
            article.id = `post-card-${id}`;
            article.innerHTML = `
                <div class="card-suggestion-header">
                    <span><i class="fa-solid fa-circle-info"></i> Activity feed updates from verified spaces</span>
                    <button class="btn-outline-sm" style="display:none;">Join</button>
                </div>
                
                <div class="card-author-info">
                    <div class="author-avatar">${user.charAt(0).toUpperCase()}</div>
                    <div class="author-meta">
                        <span class="author-name">${user} <i class="fa-solid fa-certificate"></i></span>
                        <span class="post-date">${new Date(time).toLocaleDateString()} &bull; posted in <strong>${groupContext}</strong></span>
                    </div>
                    <button class="share-btn-icon" aria-label="Share resource link"><i class="fa-solid fa-share"></i></button>
                </div>

                <div class="card-body">
                    <p>${text}</p>
                </div>

                <div class="card-interaction-bar">
                    <div class="action-buttons">
                        <button class="action-btn" id="like-btn-${id}" onclick="processLikeCommit('${id}')">
                            <i class="fa-regular fa-thumbs-up"></i> <span id="like-qty-${id}">${likes}</span>
                        </button>
                        <button class="action-btn" onclick="document.getElementById('comment-field-${id}').focus()">
                            <i class="fa-regular fa-face-smile"></i> Feel
                        </button>
                    </div>
                    
                    <div class="stats-row">
                        <span><i class="fa-regular fa-comment"></i> Feed Comment Entry</span>
                    </div>
                </div>

                <div class="card-comment-section">
                    <input type="text" class="comment-input" id="comment-field-${id}" placeholder="Write a comment..." onkeypress="processCommentCommit(event, '${id}')">
                </div>
            `;
            return article;
        }

        function renderGroupSuggestions(joinedGroupIds) {
            const targetList = document.getElementById('dynamicGroupsZone');
            targetList.innerHTML = '';

            const masterGroups = [
                { id: "G1", name: "Pet Rescue & Recovery Stories", context: "Trackyn Core Space" },
                { id: "G2", name: "Trackyn Members Circle", context: "Global Headquarters" },
                { id: "G3", name: "Trackyn Owner Community", context: "Regional Outpost" }
            ];

            masterGroups.forEach(group => {
                const checkedJoinState = joinedGroupIds.includes(group.id);
                const activationButton = checkedJoinState 
                    ? `<button class="btn-outline-sm full-width" disabled>Joined</button>`
                    : `<button class="btn-outline-sm full-width" id="join-target-${group.id}" onclick="processGroupJoinCommit('${group.id}')">Join</button>`;

                targetList.innerHTML += `
                    <div class="group-item">
                        <div class="group-thumbnail" style="background-color: #141979; display: flex; align-items: center; justify-content: center; color: #fff;">
                            <i class="fa-solid fa-shield-dog"></i>
                        </div>
                        <div class="group-details">
                            <h4 class="group-name">${group.name}</h4>
                            <span class="group-members"><i class="fa-solid fa-globe"></i> ${group.context}</span>
                            ${activationButton}
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // OPTIMISTIC INTERFACE MUTATION ENGINE LATCH
        // ==========================================

        async function executePostPublish() {
            const inputField = document.getElementById('tkn-post-textarea');
            const dataString = inputField.value.trim();
            if (!dataString) return;

            const triggerBtn = document.getElementById('btnSubmitPost');
            inputField.disabled = true;
            triggerBtn.disabled = true;
            triggerBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;

            try {
                const executionResult = await executeBackendAction('create_post', {
                    Username: currentUser,
                    Content: dataString
                });

                if (executionResult.success) {
                    const freshCardNode = buildPostCardNode(executionResult.postId, currentUser, dataString, executionResult.timestamp, 0, 'Trackyn Global Circle');
                    const streamList = document.getElementById('dynamicFeedZone');
                    
                    if (streamList.firstChild) {
                        streamList.insertBefore(freshCardNode, streamList.firstChild);
                    } else {
                        streamList.appendChild(freshCardNode);
                    }
                    inputField.value = '';
                }
            } catch (err) {
                console.error("Pipeline post structural injection failure:", err);
            } finally {
                inputField.disabled = false;
                triggerBtn.disabled = false;
                triggerBtn.innerHTML = `Publish Post <i class="fa-solid fa-paper-plane" style="margin-left:6px;"></i>`;
            }
        }

        function processLikeCommit(postId) {
            const interactionButton = document.getElementById(`like-btn-${postId}`);
            const textMetrics = document.getElementById(`like-qty-${postId}`);
            const vectorIcon = interactionButton.querySelector('i');

            let numericQuantity = parseInt(textMetrics.innerText);
            let stateFlag = interactionButton.classList.contains('liked');
            let incrementalOffset = stateFlag ? -1 : 1;

            interactionButton.classList.toggle('liked');
            textMetrics.innerText = numericQuantity + incrementalOffset;

            if (stateFlag) {
                vectorIcon.className = 'fa-regular fa-thumbs-up';
            } else {
                vectorIcon.className = 'fa-solid fa-thumbs-up';
            }

            executeBackendAction('like_post', { PostID: postId, Adjustment: incrementalOffset });
        }

        function processGroupJoinCommit(groupId) {
            const buttonNode = document.getElementById(`join-target-${groupId}`);
            buttonNode.disabled = true;
            buttonNode.innerText = "Joined";

            executeBackendAction('join_group', { Username: currentUser, GroupID: groupId });
        }

        function processCommentCommit(event, postId) {
            if (event.key === 'Enter') {
                const targetInput = document.getElementById(`comment-field-${postId}`);
                const coreValue = targetInput.value.trim();
                if (!coreValue) return;

                targetInput.value = '';
                targetInput.placeholder = "Comment posted!";
                setTimeout(() => targetInput.placeholder = "Write a comment...", 2000);

                executeBackendAction('add_comment', { Username: currentUser, PostID: postId, Content: coreValue });
            }
        }

        function getFallbackPosts() {
            return [
                { PostID: "mock_1", Username: "Petid Registry", Content: "Welcome to our group Pet Rescue & Recovery Stories! A space for us to connect and share with each other.", Timestamp: new Date().toISOString(), Likes: 4, GroupName: "Pet Rescue & Recovery Stories" },
                { PostID: "mock_2", Username: "Trackyn Moderator", Content: "Welcome to Trackyn Members Circle! Drop your introductions below.", Timestamp: new Date().toISOString(), Likes: 12, GroupName: "Trackyn Members Circle" }
            ];
        }
    </script>
</body>
</html>
